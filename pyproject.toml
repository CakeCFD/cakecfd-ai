[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cakecfd_ai"
version = "0.1.0"
description = "Claude AI integration for Cake CFD - run simulations via natural language"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.34.0",
    "rich>=13.0",
]

[project.scripts]
cakecfd = "cakecfd_ai.cli:main"

[project.urls]
Repository = "https://github.com/CakeCFD/cakecfd-ai"